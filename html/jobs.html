<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Board</title>
<style>
  :root {
    --board:      #1b2430;
    --board-deep: #10151c;
    --flap:       #232d3b;
    --flap-edge:  #0c1017;
    --amber:      #e8a33d;
    --amber-dim:  #a8752c;
    --cream:      #ede6d6;
    --cream-dim:  #9aa2ad;
    --green:      #6fcf97;
    --red:        #d9695f;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--board-deep);
    background-image:
      radial-gradient(ellipse at top, rgba(255,255,255,0.03), transparent 60%);
    color: var(--cream);
    font-family: "IBM Plex Mono", "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    min-height: 100vh;
  }

  .board {
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ---- Header: departures-board marquee ---- */
  header.marquee {
    background: var(--board);
    border: 1px solid #000;
    border-radius: var(--radius);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    padding: 22px 24px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  header.marquee::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    opacity: 0.5;
  }
  .marquee-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 40px);
    letter-spacing: 0.12em;
    color: var(--amber);
    text-shadow: 0 0 10px rgba(232,163,61,0.35);
    font-weight: 700;
  }
  .sans { font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; }
  .status-line {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--cream-dim);
  }
  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    box-shadow: 0 0 6px var(--green);
    position: relative;
    top: -1px;
  }
  .status-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }

  /* ---- Home link ---- */
  .home-link-row {
    margin-bottom: 14px;
  }
  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    background: var(--flap);
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    border-radius: var(--radius);
    padding: 8px 14px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 0.04em;
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .home-link:hover {
    background: var(--amber);
    color: var(--board-deep);
  }

  /* ---- Controls ---- */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0 20px;
  }
  .controls input[type="text"] {
    flex: 1 1 240px;
    background: var(--flap);
    border: 1px solid #000;
    border-radius: var(--radius);
    color: var(--cream);
    padding: 11px 13px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .controls input[type="text"]::placeholder { color: var(--cream-dim); }
  .controls input[type="text"]:focus { border-color: var(--amber); }

  .chip-select {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    background: var(--flap);
    border: 1px solid #000;
    color: var(--cream-dim);
    border-radius: var(--radius);
    padding: 10px 13px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-transform: uppercase;
  }
  .chip:hover { color: var(--cream); }
  .chip.active {
    color: var(--board-deep);
    background: var(--amber);
    border-color: var(--amber-dim);
    font-weight: 700;
  }

  /* ---- Column headers (filterable) ---- */
  .cols {
    display: grid;
    grid-template-columns: 90px 1.6fr 1.3fr 1fr 100px;
    gap: 10px;
    padding: 0 16px 8px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--cream-dim);
    text-transform: uppercase;
    position: relative;
  }
  .col-head {
    position: relative;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    user-select: none;
    color: inherit;
  }
  .col-head:hover { color: var(--cream); }
  .col-head.filtered { color: var(--amber); }
  .col-head .caret { font-size: 9px; opacity: 0.7; }
  .cols .col-head:last-child { justify-content: flex-end; }
  .cols > *:last-child { text-align: right; }

  .filter-panel {
    position: absolute;
    top: 100%;
    left: 0;
    margin-top: 6px;
    z-index: 20;
    min-width: 220px;
    max-width: 280px;
    background: var(--flap);
    border: 1px solid var(--amber-dim);
    border-radius: var(--radius);
    box-shadow: 0 10px 24px rgba(0,0,0,0.5);
    padding: 10px;
    text-transform: none;
    letter-spacing: normal;
    font-size: 13px;
    color: var(--cream);
  }
  .cols > *:last-child .filter-panel { left: auto; right: 0; }
  .filter-panel input[type="text"] {
    width: 100%;
    box-sizing: border-box;
    background: var(--board);
    border: 1px solid #000;
    border-radius: var(--radius);
    color: var(--cream);
    padding: 7px 9px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    outline: none;
    margin-bottom: 8px;
  }
  .filter-panel input[type="text"]:focus { border-color: var(--amber); }
  .filter-options {
    max-height: 220px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 5px;
  }
  .filter-option {
    display: flex;
    align-items: center;
    gap: 7px;
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--cream-dim);
    cursor: pointer;
  }
  .filter-option:hover { color: var(--cream); }
  .filter-option input { accent-color: var(--amber); flex-shrink: 0; }
  .filter-option .count { margin-left: auto; opacity: 0.6; font-size: 11px; }
  .filter-actions {
    display: flex;
    justify-content: space-between;
    gap: 8px;
    margin-top: 9px;
    padding-top: 9px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .filter-actions button {
    background: none;
    border: 1px solid var(--amber-dim);
    color: var(--amber);
    border-radius: var(--radius);
    padding: 6px 10px;
    font-family: "Inter", sans-serif;
    font-size: 11px;
    letter-spacing: 0.03em;
    cursor: pointer;
  }
  .filter-actions button:hover { background: var(--amber); color: var(--board-deep); }
  .filter-empty {
    font-family: "Inter", sans-serif;
    font-size: 12px;
    color: var(--cream-dim);
    padding: 4px 2px;
  }

  /* ---- Rows (the split-flap listings) ---- */
  #rows { display: flex; flex-direction: column; gap: 6px; }

  .row {
    display: grid;
    grid-template-columns: 90px 1.6fr 1.3fr 1fr 100px;
    gap: 10px;
    align-items: center;
    background: var(--flap);
    border: 1px solid var(--flap-edge);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    transform-origin: top center;
    animation: flip-in 0.5s ease both;
  }
  .row:hover { outline: 1px solid var(--amber-dim); }
  .row:nth-child(n) { animation-delay: calc(var(--i, 0) * 25ms); }

  @keyframes flip-in {
    0%   { opacity: 0; transform: rotateX(-90deg); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: rotateX(0deg); }
  }

  .row .age { color: var(--amber); font-size: 12px; white-space: nowrap; }
  .row .title { font-weight: 700; color: var(--cream); font-size: 14px; line-height: 1.3; }
  .row .company { color: var(--cream-dim); font-size: 13px; }
  .row .location { color: var(--cream-dim); font-size: 12px; }
  .row .source {
    text-align: right;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--board-deep);
    background: var(--amber-dim);
    padding: 4px 7px;
    border-radius: 2px;
    justify-self: end;
  }
  .row .tags {
    grid-column: 2 / 4;
    margin-top: 4px;
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.8;
  }

  /* ---- States ---- */
  .empty, .loading, .error-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--cream-dim);
    font-family: "Inter", sans-serif;
    font-size: 14px;
  }
  .error-msg { color: var(--red); }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--cream-dim);
    margin-top: 40px;
    font-family: "Inter", sans-serif;
  }
  footer a { color: var(--amber-dim); }

  /* ---- Mobile ---- */
  @media (max-width: 720px) {
    .cols { display: none; }
    .row {
      grid-template-columns: 1fr;
      gap: 4px;
    }
    .row .age { order: -1; }
    .row .source { justify-self: start; margin-top: 4px; }
    .row .tags { grid-column: 1; }
  }
  @media (max-width: 480px) {
    .home-link { padding: 7px 11px; font-size: 11px; }
  }
</style>
</head>
<body>
  <div class="board">
    <div class="home-link-row">
      <a class="home-link sans" href="/">&larr; Return to Home</a>
    </div>

    <header class="marquee">
      <div class="marquee-top">
        <h1>JOB BOARD</h1>
        <div class="status-line sans" id="statusLine"><span class="status-dot"></span>loading&hellip;</div>
      </div>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search title, company, or tag&hellip;" />
    </div>

    <div class="cols" id="colsRow"></div>

    <div id="rows">
      <div class="loading">Fetching listings&hellip;</div>
    </div>

    <footer class="sans">
      Aggregated from RemoteOK, Remotive, Arbeitnow, Amazon, and Greenhouse/Lever/Workday/Ashby
      company boards &middot; refreshed automatically.
      Listings link out to the original posting &mdash; always apply on the source site.
    </footer>
  </div>

<script>
  let ALL_JOBS = [];

  // Column filter config. "values" = checklist of unique values (with a
  // search-within box). "buckets" = fixed checklist of posted-age buckets.
  // "text" = a single free-text keyword filter.
  const COLUMNS = [
    { key: "posted", field: "posted", label: "Posted", type: "buckets" },
    { key: "title", field: "title", label: "Position", type: "text" },
    { key: "company", field: "company", label: "Company", type: "values" },
    { key: "location", field: "location", label: "Location", type: "values" },
    { key: "source", field: "source", label: "Source", type: "values" },
  ];

  const BUCKETS = [
    { key: "24h", label: "Last 24 hours" },
    { key: "7d", label: "Last 7 days" },
    { key: "30d", label: "Last 30 days" },
    { key: "older", label: "Older than 30 days" },
    { key: "unknown", label: "Unknown date" },
  ];

  // filters.posted / .company / .location / .source are Sets of allowed
  // values (empty Set = no filter on that column). filters.title is a plain
  // lowercased keyword string.
  const filters = { posted: new Set(), title: "", company: new Set(), location: new Set(), source: new Set() };
  const panelSearch = { company: "", location: "", source: "" };
  let openPanel = null;

  function postedBucket(iso) {
    if (!iso) return "unknown";
    const then = new Date(iso).getTime();
    if (Number.isNaN(then)) return "unknown";
    const hrs = (Date.now() - then) / (1000 * 60 * 60);
    if (hrs < 24) return "24h";
    const days = hrs / 24;
    if (days < 7) return "7d";
    if (days < 30) return "30d";
    return "older";
  }

  function columnHasFilter(col) {
    return col.type === "text" ? filters[col.key].length > 0 : filters[col.key].size > 0;
  }

  function timeAgo(iso) {
    if (!iso) return "—";
    const then = new Date(iso).getTime();
    if (Number.isNaN(then)) return "—";
    const diffMs = Date.now() - then;
    const hrs = diffMs / (1000 * 60 * 60);
    if (hrs < 1) return "just now";
    if (hrs < 24) return Math.round(hrs) + "h ago";
    const days = Math.round(hrs / 24);
    if (days < 30) return days + "d ago";
    return Math.round(days / 30) + "mo ago";
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function matchesColumnFilters(j) {
    if (filters.posted.size && !filters.posted.has(postedBucket(j.posted))) return false;
    if (filters.title && !String(j.title || "").toLowerCase().includes(filters.title)) return false;
    if (filters.company.size && !filters.company.has(j.company)) return false;
    if (filters.location.size && !filters.location.has(j.location)) return false;
    if (filters.source.size && !filters.source.has(j.source)) return false;
    return true;
  }

  function getFilteredJobs() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    let jobs = ALL_JOBS.filter(matchesColumnFilters);
    if (q) {
      jobs = jobs.filter((j) => {
        const haystack = `${j.title} ${j.company} ${j.location} ${(j.tags || []).join(" ")}`.toLowerCase();
        return haystack.includes(q);
      });
    }
    return jobs;
  }

  function render() {
    const rowsEl = document.getElementById("rows");
    const jobs = getFilteredJobs();

    if (jobs.length === 0) {
      rowsEl.innerHTML = `<div class="empty">No listings match the current search/filters.</div>`;
      return;
    }

    rowsEl.innerHTML = jobs.map((j, i) => `
      <a class="row" style="--i:${i % 20}" href="${escapeHtml(j.url)}" target="_blank" rel="noopener noreferrer">
        <span class="age">${timeAgo(j.posted)}</span>
        <span class="title">${escapeHtml(j.title)}</span>
        <span class="company">${escapeHtml(j.company)}</span>
        <span class="location">${escapeHtml(j.location)}</span>
        <span class="source">${escapeHtml(j.source)}</span>
        ${j.tags && j.tags.length ? `<span class="tags">${j.tags.slice(0, 6).map(escapeHtml).join(" &middot; ")}</span>` : ""}
      </a>
    `).join("");
  }

  // ---- Column header filter dropdowns ---------------------------------

  function valueCounts(field) {
    const counts = new Map();
    for (const j of ALL_JOBS) {
      const v = j[field] || "Unspecified";
      counts.set(v, (counts.get(v) || 0) + 1);
    }
    return [...counts.entries()].sort((a, b) => a[0].localeCompare(b[0]));
  }

  function bucketCounts() {
    const counts = new Map();
    for (const j of ALL_JOBS) {
      const b = postedBucket(j.posted);
      counts.set(b, (counts.get(b) || 0) + 1);
    }
    return BUCKETS.map((b) => ({ ...b, count: counts.get(b.key) || 0 }));
  }

  function renderOptionsList(col) {
    if (col.type === "buckets") {
      return bucketCounts().map((b) => `
        <label class="filter-option">
          <input type="checkbox" data-key="${col.key}" data-value="${escapeHtml(b.key)}" ${filters.posted.has(b.key) ? "checked" : ""} />
          <span>${escapeHtml(b.label)}</span>
          <span class="count">${b.count}</span>
        </label>
      `).join("");
    }
    const search = panelSearch[col.key] || "";
    const entries = valueCounts(col.field).filter(([v]) => v.toLowerCase().includes(search.toLowerCase()));
    if (entries.length === 0) return `<div class="filter-empty">No matches.</div>`;
    return entries.map(([v, count]) => `
      <label class="filter-option">
        <input type="checkbox" data-key="${col.key}" data-value="${escapeHtml(v)}" ${filters[col.key].has(v) ? "checked" : ""} />
        <span>${escapeHtml(v)}</span>
        <span class="count">${count}</span>
      </label>
    `).join("");
  }

  function renderPanel(col) {
    if (col.type === "text") {
      return `
        <div class="filter-panel" data-panel="${col.key}">
          <input type="text" data-role="text-filter" data-key="${col.key}" placeholder="Filter ${escapeHtml(col.label.toLowerCase())}&hellip;" value="${escapeHtml(filters.title)}" />
          <div class="filter-actions">
            <button type="button" data-action="clear" data-key="${col.key}">Clear</button>
            <button type="button" data-action="close">Close</button>
          </div>
        </div>
      `;
    }
    return `
      <div class="filter-panel" data-panel="${col.key}">
        ${col.type === "values" ? `<input type="text" data-role="panel-search" data-key="${col.key}" placeholder="Search&hellip;" value="${escapeHtml(panelSearch[col.key] || "")}" />` : ""}
        <div class="filter-options" data-options="${col.key}">${renderOptionsList(col)}</div>
        <div class="filter-actions">
          <button type="button" data-action="clear" data-key="${col.key}">Clear</button>
          <button type="button" data-action="close">Close</button>
        </div>
      </div>
    `;
  }

  function renderCols() {
    const el = document.getElementById("colsRow");
    el.innerHTML = COLUMNS.map((col) => `
      <div class="col-head ${columnHasFilter(col) ? "filtered" : ""}" data-col="${col.key}" role="button" tabindex="0" aria-haspopup="true" aria-expanded="${openPanel === col.key}">
        ${escapeHtml(col.label)}<span class="caret">${openPanel === col.key ? "&#9650;" : "&#9660;"}</span>
        ${openPanel === col.key ? renderPanel(col) : ""}
      </div>
    `).join("");

    if (openPanel) {
      const input = el.querySelector(`[data-panel="${openPanel}"] input[type="text"]`);
      if (input) {
        input.focus();
        input.setSelectionRange(input.value.length, input.value.length);
      }
    }
  }

  function initColsEvents() {
    const el = document.getElementById("colsRow");

    el.addEventListener("click", (e) => {
      const actionBtn = e.target.closest("[data-action]");
      if (actionBtn) {
        e.stopPropagation();
        const key = actionBtn.dataset.key;
        if (actionBtn.dataset.action === "clear") {
          const col = COLUMNS.find((c) => c.key === key);
          if (col.type === "text") filters.title = "";
          else if (col.type === "buckets") filters.posted.clear();
          else filters[key].clear();
          if (panelSearch[key] !== undefined) panelSearch[key] = "";
          render();
          renderCols();
        } else if (actionBtn.dataset.action === "close") {
          openPanel = null;
          renderCols();
        }
        return;
      }

      const panel = e.target.closest(".filter-panel");
      if (panel) { e.stopPropagation(); return; }

      const head = e.target.closest(".col-head");
      if (head) {
        openPanel = openPanel === head.dataset.col ? null : head.dataset.col;
        renderCols();
      }
    });

    el.addEventListener("keydown", (e) => {
      if (e.key !== "Enter" && e.key !== " ") return;
      if (!e.target.classList.contains("col-head")) return; // ignore typing inside panel inputs
      e.preventDefault();
      openPanel = openPanel === e.target.dataset.col ? null : e.target.dataset.col;
      renderCols();
    });

    el.addEventListener("change", (e) => {
      if (e.target.matches('input[type="checkbox"]')) {
        const { key, value } = e.target.dataset;
        const col = COLUMNS.find((c) => c.key === key);
        const set = col.type === "buckets" ? filters.posted : filters[key];
        if (e.target.checked) set.add(value); else set.delete(value);
        render();
        el.querySelector(`[data-col="${key}"]`).classList.toggle("filtered", columnHasFilter(col));
      }
    });

    el.addEventListener("input", (e) => {
      if (e.target.matches('[data-role="text-filter"]')) {
        filters.title = e.target.value.trim().toLowerCase();
        render();
        el.querySelector(`[data-col="${e.target.dataset.key}"]`).classList.toggle("filtered", filters.title.length > 0);
      } else if (e.target.matches('[data-role="panel-search"]')) {
        const key = e.target.dataset.key;
        panelSearch[key] = e.target.value;
        el.querySelector(`[data-options="${key}"]`).innerHTML = renderOptionsList(COLUMNS.find((c) => c.key === key));
      }
    });

    document.addEventListener("click", (e) => {
      if (openPanel && !e.target.closest(".col-head")) {
        openPanel = null;
        renderCols();
      }
    });
  }

  async function init() {
    const statusLine = document.getElementById("statusLine");
    try {
      const res = await fetch("jobs.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      ALL_JOBS = data.jobs || [];

      const updated = data.updated_at ? new Date(data.updated_at) : null;
      statusLine.innerHTML = `<span class="status-dot"></span>${ALL_JOBS.length} listings &middot; updated ${
        updated ? updated.toLocaleString() : "recently"
      }`;

      renderCols();
      initColsEvents();
      render();
      document.getElementById("searchInput").addEventListener("input", render);
    } catch (err) {
      statusLine.innerHTML = `<span class="status-dot error"></span>couldn't load listings`;
      document.getElementById("rows").innerHTML =
        `<div class="error-msg">Couldn't load jobs.json (${escapeHtml(err.message)}). If you just set this up, run the fetcher once or check the GitHub Action has run.</div>`;
    }
  }

  init();
</script>

</body>
</html>
