<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Job Board</title>
<style>
  :root {
    --board:      #1b2430;
    --board-deep: #10151c;
    --flap:       #232d3b;
    --flap-edge:  #0c1017;
    --amber:      #e8a33d;
    --amber-dim:  #a8752c;
    --cream:      #ede6d6;
    --cream-dim:  #9aa2ad;
    --green:      #6fcf97;
    --red:        #d9695f;
    --radius: 3px;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--board-deep);
    background-image:
      radial-gradient(ellipse at top, rgba(255,255,255,0.03), transparent 60%);
    color: var(--cream);
    font-family: "IBM Plex Mono", "Space Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    min-height: 100vh;
  }

  .board {
    max-width: 980px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  /* ---- Header: departures-board marquee ---- */
  header.marquee {
    background: var(--board);
    border: 1px solid #000;
    border-radius: var(--radius);
    box-shadow: 0 12px 30px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    padding: 22px 24px;
    margin-bottom: 22px;
    position: relative;
    overflow: hidden;
  }
  header.marquee::before {
    content: "";
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0.18) 0px,
      rgba(0,0,0,0.18) 1px,
      transparent 1px,
      transparent 3px
    );
    pointer-events: none;
    opacity: 0.5;
  }
  .marquee-top {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 10px;
  }
  h1 {
    margin: 0;
    font-size: clamp(28px, 5vw, 40px);
    letter-spacing: 0.12em;
    color: var(--amber);
    text-shadow: 0 0 10px rgba(232,163,61,0.35);
    font-weight: 700;
  }
  .sans { font-family: "Inter", -apple-system, "Segoe UI", Roboto, sans-serif; }
  .status-line {
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--cream-dim);
  }
  .status-dot {
    display: inline-block;
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--green);
    margin-right: 6px;
    box-shadow: 0 0 6px var(--green);
    position: relative;
    top: -1px;
  }
  .status-dot.error { background: var(--red); box-shadow: 0 0 6px var(--red); }

  /* ---- Controls ---- */
  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin: 18px 0 20px;
  }
  .controls input[type="text"] {
    flex: 1 1 240px;
    background: var(--flap);
    border: 1px solid #000;
    border-radius: var(--radius);
    color: var(--cream);
    padding: 11px 13px;
    font-family: inherit;
    font-size: 14px;
    outline: none;
  }
  .controls input[type="text"]::placeholder { color: var(--cream-dim); }
  .controls input[type="text"]:focus { border-color: var(--amber); }

  .chip-select {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .chip {
    background: var(--flap);
    border: 1px solid #000;
    color: var(--cream-dim);
    border-radius: var(--radius);
    padding: 10px 13px;
    font-family: inherit;
    font-size: 12px;
    letter-spacing: 0.05em;
    cursor: pointer;
    text-transform: uppercase;
  }
  .chip:hover { color: var(--cream); }
  .chip.active {
    color: var(--board-deep);
    background: var(--amber);
    border-color: var(--amber-dim);
    font-weight: 700;
  }

  /* ---- Column headers ---- */
  .cols {
    display: grid;
    grid-template-columns: 90px 1.6fr 1.3fr 1fr 100px;
    gap: 10px;
    padding: 0 16px 8px;
    font-size: 11px;
    letter-spacing: 0.12em;
    color: var(--cream-dim);
    text-transform: uppercase;
  }
  .cols span:last-child { text-align: right; }

  /* ---- Rows (the split-flap listings) ---- */
  #rows { display: flex; flex-direction: column; gap: 6px; }

  .row {
    display: grid;
    grid-template-columns: 90px 1.6fr 1.3fr 1fr 100px;
    gap: 10px;
    align-items: center;
    background: var(--flap);
    border: 1px solid var(--flap-edge);
    border-radius: var(--radius);
    padding: 14px 16px;
    text-decoration: none;
    color: inherit;
    transform-origin: top center;
    animation: flip-in 0.5s ease both;
  }
  .row:hover { outline: 1px solid var(--amber-dim); }
  .row:nth-child(n) { animation-delay: calc(var(--i, 0) * 25ms); }

  @keyframes flip-in {
    0%   { opacity: 0; transform: rotateX(-90deg); }
    60%  { opacity: 1; }
    100% { opacity: 1; transform: rotateX(0deg); }
  }

  .row .age { color: var(--amber); font-size: 12px; white-space: nowrap; }
  .row .title { font-weight: 700; color: var(--cream); font-size: 14px; line-height: 1.3; }
  .row .company { color: var(--cream-dim); font-size: 13px; }
  .row .location { color: var(--cream-dim); font-size: 12px; }
  .row .source {
    text-align: right;
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--board-deep);
    background: var(--amber-dim);
    padding: 4px 7px;
    border-radius: 2px;
    justify-self: end;
  }
  .row .tags {
    grid-column: 2 / 4;
    margin-top: 4px;
    font-size: 11px;
    color: var(--cream-dim);
    opacity: 0.8;
  }

  /* ---- States ---- */
  .empty, .loading, .error-msg {
    text-align: center;
    padding: 60px 20px;
    color: var(--cream-dim);
    font-family: "Inter", sans-serif;
    font-size: 14px;
  }
  .error-msg { color: var(--red); }

  footer {
    text-align: center;
    font-size: 11px;
    color: var(--cream-dim);
    margin-top: 40px;
    font-family: "Inter", sans-serif;
  }
  footer a { color: var(--amber-dim); }

  /* ---- Mobile ---- */
  @media (max-width: 720px) {
    .cols { display: none; }
    .row {
      grid-template-columns: 1fr;
      gap: 4px;
    }
    .row .age { order: -1; }
    .row .source { justify-self: start; margin-top: 4px; }
    .row .tags { grid-column: 1; }
  }
</style>
</head>
<body>
  <div class="board">
    <header class="marquee">
      <div class="marquee-top">
        <h1>JOB BOARD</h1>
        <div class="status-line sans" id="statusLine"><span class="status-dot"></span>loading&hellip;</div>
      </div>
    </header>

    <div class="controls">
      <input type="text" id="searchInput" placeholder="Search title, company, or tag&hellip;" />
      <div class="chip-select" id="sourceFilters"></div>
    </div>

    <div class="cols">
      <span>Posted</span>
      <span>Position</span>
      <span>Company</span>
      <span>Location</span>
      <span>Source</span>
    </div>

    <div id="rows">
      <div class="loading">Fetching listings&hellip;</div>
    </div>

    <footer class="sans">
      Aggregated from RemoteOK, Remotive, and Arbeitnow &middot; refreshed automatically.
      Listings link out to the original posting &mdash; always apply on the source site.
    </footer>
  </div>

<script>
  let ALL_JOBS = [];
  let activeSource = "all";

  function timeAgo(iso) {
    if (!iso) return "—";
    const then = new Date(iso).getTime();
    if (Number.isNaN(then)) return "—";
    const diffMs = Date.now() - then;
    const hrs = diffMs / (1000 * 60 * 60);
    if (hrs < 1) return "just now";
    if (hrs < 24) return Math.round(hrs) + "h ago";
    const days = Math.round(hrs / 24);
    if (days < 30) return days + "d ago";
    return Math.round(days / 30) + "mo ago";
  }

  function escapeHtml(str) {
    return String(str ?? "").replace(/[&<>"']/g, (c) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }

  function render() {
    const q = document.getElementById("searchInput").value.trim().toLowerCase();
    const rowsEl = document.getElementById("rows");

    let jobs = ALL_JOBS;
    if (activeSource !== "all") {
      jobs = jobs.filter((j) => j.source === activeSource);
    }
    if (q) {
      jobs = jobs.filter((j) => {
        const haystack = `${j.title} ${j.company} ${j.location} ${(j.tags || []).join(" ")}`.toLowerCase();
        return haystack.includes(q);
      });
    }

    if (jobs.length === 0) {
      rowsEl.innerHTML = `<div class="empty">No listings match that search right now.</div>`;
      return;
    }

    rowsEl.innerHTML = jobs.map((j, i) => `
      <a class="row" style="--i:${i % 20}" href="${escapeHtml(j.url)}" target="_blank" rel="noopener noreferrer">
        <span class="age">${timeAgo(j.posted)}</span>
        <span class="title">${escapeHtml(j.title)}</span>
        <span class="company">${escapeHtml(j.company)}</span>
        <span class="location">${escapeHtml(j.location)}</span>
        <span class="source">${escapeHtml(j.source)}</span>
        ${j.tags && j.tags.length ? `<span class="tags">${j.tags.slice(0, 6).map(escapeHtml).join(" &middot; ")}</span>` : ""}
      </a>
    `).join("");
  }

  function buildSourceFilters() {
    const sources = ["all", ...new Set(ALL_JOBS.map((j) => j.source))];
    const el = document.getElementById("sourceFilters");
    el.innerHTML = sources.map((s) => `
      <button class="chip ${s === activeSource ? "active" : ""}" data-source="${escapeHtml(s)}">
        ${s === "all" ? "All" : escapeHtml(s)}
      </button>
    `).join("");
    el.querySelectorAll(".chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        activeSource = btn.dataset.source;
        el.querySelectorAll(".chip").forEach((c) => c.classList.remove("active"));
        btn.classList.add("active");
        render();
      });
    });
  }

  async function init() {
    const statusLine = document.getElementById("statusLine");
    try {
      const res = await fetch("jobs.json", { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const data = await res.json();
      ALL_JOBS = data.jobs || [];

      const updated = data.updated_at ? new Date(data.updated_at) : null;
      statusLine.innerHTML = `<span class="status-dot"></span>${ALL_JOBS.length} listings &middot; updated ${
        updated ? updated.toLocaleString() : "recently"
      }`;

      buildSourceFilters();
      render();
      document.getElementById("searchInput").addEventListener("input", render);
    } catch (err) {
      statusLine.innerHTML = `<span class="status-dot error"></span>couldn't load listings`;
      document.getElementById("rows").innerHTML =
        `<div class="error-msg">Couldn't load jobs.json (${escapeHtml(err.message)}). If you just set this up, run the fetcher once or check the GitHub Action has run.</div>`;
    }
  }

  init();
</script>

<div class="content-block button">
                    <button>
                        <a href="\index.html">
                            <b>Back to Home</b>
                        </a>
                    </button>
                </div>

</body>
</html>
